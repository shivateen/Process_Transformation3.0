<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiger Mission Control · O2C OTIF demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark product bar with module nav → step rail per module → single working column; desk adds queue/workspace panes.
   Palette follows Tiger Mission Control: warm neutrals, charcoal, Tiger orange. Semantic good/warn/bad kept apart from the accent. */
:root{
  --bg:#f5f2ec; --surface:#fffdf9; --surface-2:#f1ece3; --sunk:#ebe5da;
  --ink:#221d18; --muted:#6c645a; --faint:#9a9186; --line:#e2dbce;
  --head:#2a2420; --head-ink:#f6efe6; --head-muted:#c9b8a5;
  --accent:#d3600f; --accent-ink:#ffffff; --accent-soft:#fbe8d8; --accent-line:#efc39f;
  --good:#1d7f55; --good-soft:#e2f2e9; --warn:#a86a10; --warn-soft:#f8ecd6; --bad:#b33a2c; --bad-soft:#f7e2de;
  --s1:#3d6fa8; --s2:#8f4fae; --s3:#1c8676; --s4:#b0822a; --s5:#bf557a; --s6:#5d7d2c;
  --n1:#7a5cc4; --n2:#2f6db5; --n3:#1c8676; --n4:#b0822a; --n5:#d3600f;
  --font:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161310; --surface:#1f1b17; --surface-2:#28231e; --sunk:#2f2924;
  --ink:#f2ece3; --muted:#b1a698; --faint:#857b6f; --line:#3a332c;
  --head:#0f0d0b; --head-ink:#f6efe6; --head-muted:#b7a691;
  --accent:#f0832f; --accent-ink:#1a120b; --accent-soft:#3b2616; --accent-line:#6b4120;
  --good:#5cc392; --good-soft:#163024; --warn:#e3a94a; --warn-soft:#33270f; --bad:#ef7d6e; --bad-soft:#3a1d18;
  --s1:#7aa6dc; --s2:#c18ade; --s3:#4fc2ae; --s4:#dcb058; --s5:#e889ab; --s6:#9cc05e;
  --n1:#a98ce8; --n2:#7aa6dc; --n3:#4fc2ae; --n4:#dcb058; --n5:#f0832f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161310; --surface:#1f1b17; --surface-2:#28231e; --sunk:#2f2924;
  --ink:#f2ece3; --muted:#b1a698; --faint:#857b6f; --line:#3a332c;
  --head:#0f0d0b; --head-ink:#f6efe6; --head-muted:#b7a691;
  --accent:#f0832f; --accent-ink:#1a120b; --accent-soft:#3b2616; --accent-line:#6b4120;
  --good:#5cc392; --good-soft:#163024; --warn:#e3a94a; --warn-soft:#33270f; --bad:#ef7d6e; --bad-soft:#3a1d18;
  --s1:#7aa6dc; --s2:#c18ade; --s3:#4fc2ae; --s4:#dcb058; --s5:#e889ab; --s6:#9cc05e;
  --n1:#a98ce8; --n2:#7aa6dc; --n3:#4fc2ae; --n4:#dcb058; --n5:#f0832f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.bar{background:var(--head);color:var(--head-ink);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.02em;text-decoration:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.brand span{font-weight:500;color:var(--head-muted);font-size:13px;letter-spacing:0}
.pages{display:flex;gap:2px;flex-wrap:wrap}
.pg{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;border-radius:9px;color:var(--head-muted);text-decoration:none;font-size:12.5px;font-weight:650}
.pg:hover{background:rgba(255,255,255,.08);color:var(--head-ink)}
.pg.on{background:rgba(255,255,255,.16);color:var(--head-ink)}
.pg .pn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.16)}
.pg.on .pn{background:var(--accent);color:var(--accent-ink)}
.bar .sp{flex:1}
.client{font-size:12px;color:var(--head-muted)}
.client b{color:var(--head-ink)}
.synth{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);color:#f6b07a;padding:3px 8px;border-radius:999px;white-space:nowrap}

.steps{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;overflow-x:auto}
.steps ol{list-style:none;margin:0 auto;padding:0;display:flex;gap:2px;max-width:1240px}
.stp{display:flex;gap:9px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 10px 4px;white-space:nowrap}
.stp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--sunk);color:var(--muted);flex:none}
.stp b{font-size:13px;display:block}
.stp small{font-size:11px;color:var(--muted);display:block}
.stp.on{border-bottom-color:var(--accent)}
.stp.on .n{background:var(--accent);color:var(--accent-ink)}
.stp.done .n{background:var(--good);color:var(--surface)}

main{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-size:24px;margin-top:4px}
.lede{color:var(--muted);max-width:76ch;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel h3{font-size:15px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.say{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13px}
.say b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:650;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.src{font-family:var(--mono);font-weight:500;border-radius:6px}
.chip.off{opacity:.5;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.illus{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 7px;white-space:nowrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:650;font-size:13px}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.hero{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.tile.hero small,.tile.hero .eyebrow{color:var(--head-muted)}
.tile.hero b{color:#f6b07a}

.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
table.t select{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);max-width:200px}
tr.mh td{background:var(--surface-2);font-weight:700}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th{background:var(--surface-2);text-align:left;padding:7px 10px;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
table.grid th small{display:block;font-family:var(--font);font-weight:500;color:var(--muted);font-size:10.5px}
table.grid td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
table.grid tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}

/* landing */
.hero{max-width:900px}
.hero h1{font-size:31px;letter-spacing:-.025em;margin-top:6px;line-height:1.15}
.o2cflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:860px){.o2cflow{grid-template-columns:minmax(0,1fr)}}
.node{border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--nc);display:flex;flex-direction:column;gap:6px}
.node b{font-size:14px}
.node ul{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.flow3{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr) 52px minmax(0,1fr)}
@media (max-width:980px){.flow3{grid-template-columns:minmax(0,1fr)}}
.lmod{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;text-decoration:none}
.lmod:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.lmod ul{margin:2px 0 0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.lcta{margin-top:auto;font-weight:700;color:var(--accent);font-size:13px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.larrow{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;font-size:20px}
@media (max-width:980px){.larrow{height:30px;transform:rotate(90deg)}}

/* context */
.conns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.conn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.conn.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.conn .top{display:flex;gap:10px;align-items:center}
.lg{width:38px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:10.5px;color:#fff;flex:none}
.conn h4{font-size:14px}
.conn .st{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.tgrp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.xgrp{padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tpick{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.tpick:not(.on){opacity:.6}
.tpick input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.tp-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tp-main b{font-size:12px;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.tp-main small{font-size:11px;color:var(--muted)}
.tp-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px}
.explorer{display:grid;grid-template-columns:280px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media (max-width:820px){.explorer{grid-template-columns:minmax(0,1fr)}}
.xlist{border-right:1px solid var(--line);background:var(--surface-2);max-height:600px;overflow-y:auto}
@media (max-width:820px){.xlist{border-right:0;border-bottom:1px solid var(--line);max-height:260px}}
.xi{width:100%;display:flex;flex-direction:column;gap:1px;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 14px}
.xi:hover{background:var(--sunk)}
.xi.on{background:var(--surface);border-left-color:var(--accent)}
.xi b{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.xi b .mono{overflow:hidden;text-overflow:ellipsis}
.xi small{font-size:11px;color:var(--muted)}
.xview{min-width:0;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.xview h4{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.docbody{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:16px 18px;font-size:13px;line-height:1.65;max-height:380px;overflow-y:auto}
.docbody p+p{margin-top:10px}
.docbody.mail{font-family:var(--mono);font-size:12px}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px}
.krow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.9fr);gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
@media (max-width:820px){.krow{grid-template-columns:minmax(0,1fr)}}
.krow .kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.krow .kv b{font-size:18px;font-weight:800}
.qtrack{position:relative;height:12px;border-radius:4px;background:var(--sunk)}
.qtrack .mk{position:absolute;top:-3px;width:2px;height:18px;background:var(--faint)}
.qtrack .mk.tq{background:var(--good)}
.qtrack .dot{position:absolute;top:-2px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--accent);transform:translateX(-50%)}
.qlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.kgrp>h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;display:flex;gap:8px;align-items:center}
.kgrp:first-child>h4{margin-top:0}
.log{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.log .ok{color:var(--good);margin-right:8px}
.rule{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.8fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.rule:last-child{border-bottom:0}
@media (max-width:760px){.rule{grid-template-columns:minmax(0,1fr)}}

/* charts */
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;height:auto}
.lbl{font-family:var(--font);font-size:11.5px;fill:var(--ink);font-weight:600}
.lbl2{font-family:var(--font);font-size:10.5px;fill:var(--muted)}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hrow:last-child{border-bottom:0}
.track{position:relative;height:8px;background:var(--sunk);border-radius:4px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.track em{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink)}
@media (max-width:640px){.hrow{grid-template-columns:minmax(0,1fr)}}
.trace{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.tn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;max-width:230px;display:flex;flex-direction:column;gap:3px}
.tn small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tn .s{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.tn.bad{background:var(--bad-soft);border-color:transparent}
.tn.doc{background:var(--accent-soft);border-color:transparent}
.ta{align-self:center;color:var(--faint);font-weight:700}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:12px}
.vbox{border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.vbox b{font-size:18px;font-variant-numeric:tabular-nums}
.vbox.hl{background:var(--accent-soft)}
.vbox.hl b{color:var(--accent)}

/* builder */
.objgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.obj{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:7px}
.obj:hover{border-color:var(--accent-line)}
.obj.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.obj h3{font-size:16px;padding-right:26px}
.obj .k{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted);margin-top:auto}
.obj .k b{font-size:18px;color:var(--ink)}
.obj .tick{position:absolute;top:14px;right:14px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line)}
.obj.on .tick{background:var(--accent);border-color:var(--accent)}

}
function sankey(cols,links,o){
  const W=o.W||940,H=o.H,ml=o.ml||220,mr=o.mr||200,gp=o.gap||12,nw=12;
  const xs=cols.map((c,i)=>cols.length===1?ml:ml+i*((W-ml-mr-nw)/(cols.length-1)));let k=Infinity;
  cols.forEach(c=>{const tot=c.reduce((a,n)=>a+n.v,0);if(tot>0)k=Math.min(k,(H-gp*(c.length-1))/tot)});
  if(o.target){const last=cols[cols.length-1];const tot=last.reduce((a,n)=>a+n.v,0);k=Math.min(k,(H-gp*(last.length-1))/Math.max(tot,o.target))}
  const pos={};
  cols.forEach((c,ci)=>{const tot=c.reduce((a,n)=>a+n.v,0);let y=ci===cols.length-1&&o.target?0:(H-(tot*k+gp*(c.length-1)))/2;
    c.forEach(n=>{pos[n.id]={x:xs[ci],y,h:Math.max(n.v*k,1.5),ci,n,out:0,inn:0};y+=n.v*k+gp})});
  let paths='';
  [...links].sort((a,b)=>pos[a.t].y-pos[b.t].y).forEach(l=>{l.y0=pos[l.s].y+pos[l.s].out;pos[l.s].out+=l.v*k});
  [...links].sort((a,b)=>pos[a.s].y-pos[b.s].y).forEach(l=>{l.y1=pos[l.t].y+pos[l.t].inn;pos[l.t].inn+=l.v*k});
  links.forEach(l=>{const x0=pos[l.s].x+nw,x1=pos[l.t].x,xm=(x0+x1)/2,h=l.v*k;
    paths+=`<path d="M${x0},${l.y0} C${xm},${l.y0} ${xm},${l.y1} ${x1},${l.y1} L${x1},${l.y1+h} C${xm},${l.y1+h} ${xm},${l.y0+h} ${x0},${l.y0+h} Z" fill="${l.c}" fill-opacity="0.28"><title>${esc(l.title||'')}</title></path>`});
  let nodes='';
  Object.values(pos).forEach(p=>{const n=p.n,first=p.ci===0,cy=p.y+p.h/2,tx=first?p.x-8:p.x+nw+8,anc=first?'end':'start';
    nodes+=`<rect x="${p.x}" y="${p.y}" width="${nw}" height="${p.h}" rx="2" fill="${n.c}"/>`;
    if(p.h>=22||!first)nodes+=`<text x="${tx}" y="${cy-1}" text-anchor="${anc}" class="lbl halo">${esc(n.l)}</text><text x="${tx}" y="${cy+12}" text-anchor="${anc}" class="lbl2 halo">${esc(n.s||'')}</text>`;
    else nodes+=`<text x="${tx}" y="${cy+4}" text-anchor="${anc}" class="lbl halo">${esc(n.l)} <tspan class="lbl2">${esc(n.s||'')}</tspan></text>`});
  let tg='';
  if(o.target){const last=cols[cols.length-1][0],p=pos[last.id],x=p.x+nw+4,y1=p.y+o.target*k;
    tg=`<line x1="${x-nw-8}" y1="${y1}" x2="${x+170}" y2="${y1}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x+170}" y="${y1-5}" text-anchor="end" class="lbl2 halo" style="fill:var(--ink);font-weight:700">Gap ${esc(o.targetLabel)}</text>`}
  return `<svg viewBox="0 0 ${W} ${H+8}" role="img" aria-label="${esc(o.aria||'Value flow')}" style="min-width:700px">${paths}${nodes}${tg}</svg>`;
}

/* ================= router and events ================= */
function render(){const id=(location.hash||'#home').slice(1);const pid=PAGE[id]?id:'home';$('#main').innerHTML=PAGE[pid]()}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
function connect(k,cb){if(conn(k)){cb&&cb();return}S.busy[k]=1;render();setTimeout(()=>{delete S.busy[k];S.conn[k]=2;if(S.kg===2)S.kg=0;render();cb&&cb()},fast()?30:450)}
function buildKg(){S.kg=1;S.kgReady=false;S.kgLog=[];render();const L=kgLines();let i=0;const tick=()=>{S.kgLog.push(L[i++]);if(i<L.length){render();setTimeout(tick,fast()?10:230)}else{S.kgReady=true;render()}};setTimeout(tick,fast()?10:150)}
document.addEventListener('click',ev=>{
  if(ev.target.id==='ovl'){S.cfgOpen=null;render();return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,k=b.dataset.k;
  if(a==='tbl')return;
  if(a==='conn'){connect(k);return}
  if(a==='cfg'){S.cfgOpen=k;render();setTimeout(()=>{const f=document.querySelector('.mdl select,.mdl input');f&&f.focus()},0);return}
  if(a==='cfgclose'){const k0=S.cfgOpen;S.cfgOpen=null;render();const g=document.querySelector(`.gear[data-k="${k0}"]`);g&&g.focus();return}
  if(a==='cfgsave'){const o={};document.querySelectorAll('.mdl [data-cf]').forEach(el=>o[el.dataset.cf]=el.value);S.cfg[k]=o;S.cfgOpen=null;toast(SYS.find(x=>x.k===k).n+' settings saved');render();return}
  if(a==='cfgtest'){const t=$('#ctest'),sk=S.cfgOpen,env=($('#cf-env')||{}).value||'';t.className='ctest';t.innerHTML='<span class="spin"></span> Testing read-only access…';t.scrollIntoView({block:'nearest'});b.disabled=true;
    setTimeout(()=>{b.disabled=false;t.className='ctest ok';t.textContent=`✓ ${SYS.find(x=>x.k===sk).n} · ${env} · authenticated, read-only scope confirmed, ${TABLES.filter(x=>x.sys===sk).length||DOCS.length} ${sk==='doc'?'documents':'tables'} reachable. (Simulated)`;t.scrollIntoView({block:'nearest'})},fast()?30:900);return}
  if(a==='connall'){const ks=SYS.map(s=>s.k).filter(x=>!conn(x));const nx=()=>{const x=ks.shift();if(x)connect(x,nx)};nx();return}
  if(a==='scope'){S.scope=S.scope.includes(k)?S.scope.filter(x=>x!==k):[...S.scope,k];S.tables={};if(S.kg===2)S.kg=0;render();return}
  if(a==='tblall'){TABLES.forEach(t=>S.tables[t.id]=true);if(S.kg===2)S.kg=0;render();return}
  if(a==='tbldef'){S.tables={};if(S.kg===2)S.kg=0;render();return}
  if(a==='cstep'){S.cstep=+b.dataset.i;render();window.scrollTo({top:0});return}
  if(a==='xtab'){S.xtab=k;S.xsel=null;render();return}
  if(a==='xsys'){S.xsys=k;S.xsel=null;render();return}
  if(a==='xsel'){S.xsel=k;render();return}
  if(a==='kg'){buildKg();return}
  if(a==='wfa'){S.wfa=k;render();return}
  if(a==='wf30'){S.wfa='30';S.cstep=2;return}
  if(a==='kgshow'){S.kg=2;S.kgReady=false;render();window.scrollTo({top:0});return}
  if(a==='rf'){S.rf=k;render();return}
  if(a==='bstep'){S.bstep=+b.dataset.i;render();window.scrollTo({top:0});return}
  if(a==='obj'){if(S.obj!==k){S.obj=k;S.mSel=null}render();return}
  if(a==='addscope'){if(!S.scope.includes(S.obj))S.scope.push(S.obj);S.tables={};render();return}
  if(a==='democtx'){SYS.forEach(s=>S.conn[s.k]=2);if(!S.scope.includes(S.obj))S.scope.push(S.obj);S.kg=2;render();return}
  if(a==='scen'){S.scen=k;render();return}
  if(a==='msel'){S.mSel.has(k)?S.mSel.delete(k):S.mSel.add(k);S.locked=false;render();return}
  if(a==='psel'){S.pSel.has(k)?S.pSel.delete(k):S.pSel.add(k);S.locked=false;render();return}
  if(a==='lock'){S.locked=true;S.lockedObj=S.obj;logIt('ricardo','locked the blueprint for “'+O().n+'”',['marisol','jorge']);render();return}
  if(a==='opt'){S.opt=k;render();return}
  if(a==='app'){S.app=k;render();return}
  if(a==='vreset'){S.v={...VDEF};render();return}
  if(a==='lane'){S.lane=k;const f=ITEMS.find(i=>i.lane===k);S.sel=f?f.id:null;render();return}
  if(a==='pick'){const it=ITEMS.find(i=>i.id===k);if(it){S.lane=it.lane;S.sel=k}render();return}
  if(a==='thread'){S.threadDone=true;logIt('ana','approved INV-90881234: MXN 43,740 to cash application, 4-case credit to route accounting, UCX case linked',['jorge','paola']);toast('Routed to cash application and route accounting');render();return}
  if(a==='undo-thread'){S.threadDone=false;logIt('ana','undid routing of INV-90881234',['jorge','paola']);render();return}
  if(a==='adone'){const aud=(b.dataset.aud||'').split(',').filter(Boolean);S.done[k]=b.dataset.v;S.dmeta[k]={aud,txt:b.dataset.l};logIt('agent',b.dataset.l,aud);toast(b.dataset.v);render();return}
  if(a==='arule'){S.arules[k]=!S.arules[k];render();return}
  if(a==='goto'){const d=b.dataset;if(d.ctx&&!allConn()){SYS.forEach(x=>S.conn[x.k]=2);S.kg=2}
    if(d.c!==undefined)S.cstep=+d.c;if(d.b!==undefined)S.bstep=+d.b;if(d.p)S.persona=d.p;
    const h='#'+d.h;if(location.hash===h)render();else location.hash=h;window.scrollTo(0,0);
    if(d.sc)setTimeout(()=>{const e=document.getElementById(d.sc);e&&e.scrollIntoView({block:'start'})},150);return}
  if(a==='hl'){S.hl=k;S.hd=0;render();return}
  if(a==='hd'){S.hd=+k;render();return}
  if(a==='hdv'){S.hdv[b.dataset.r]=+b.dataset.f;render();return}
  if(a==='hre'){S.hre=+k;render();return}
  if(a==='hlag'){S.hlag=k&&S.hlag!==k?k:null;render();return}
  if(a==='do'){const who=PMAP[S.persona],aud=(b.dataset.aud||'').split(',').filter(Boolean),txt=b.dataset.l||(b.dataset.v.charAt(0).toLowerCase()+b.dataset.v.slice(1)+' · '+k);
    S.done[k]=b.dataset.v;S.dmeta[k]={aud,txt};if(b.dataset.r)S.res[k]={k:b.dataset.r,amt:+b.dataset.amt||0,by:who,ag:b.dataset.ag==='1'};
    logIt(who,txt,aud);toast(b.dataset.v);render();return}
  if(a==='undo'){const m=S.dmeta[k]||{aud:[],txt:k};const ix=PPORDER.indexOf(k);(ix>=0?PPORDER.slice(ix):[k]).forEach(x=>{delete S.done[x];delete S.res[x];delete S.dmeta[x]});logIt(PMAP[S.persona],'undid: '+m.txt,m.aud);render();return}
  if(a==='refresh'){S.staleSnooze=true;ITEMS.filter(i=>i.lane==='paused').forEach(i=>{i.lane='collect';i.coll=i.sapAmt;i.reason='Released after feed refresh: the store accepted in full. Collectible.';i.pat='P01';i.conf=.9;i.act='Send the first reminder with the CFDI attached';i.out={k:'contact',txt:'First reminder sent with the CFDI',lg:'sent the first reminder to '+i.chain+', '+i.id}});logIt('agent','route 233 handheld feed refreshed; released 3 of Ana Ruiz’s invoices to her collect list',['ana']);toast('Feed refreshed');if(S.lane==='paused'){S.lane='collect';S.sel='STMT-SG-0921'}render();return}
  if(a==='opp'){S.oppSent[k]=true;logIt('ana','sent an opportunity to '+b.dataset.to,[{o1:'jorge',o2:'elena',o3:'daniela'}[k]]);toast('Sent to '+b.dataset.to);render();return}
  if(a==='promote'){S.rulePromoted[k]=true;logIt('marisol','let rule '+k+' act on its own: short-delivery credits under MXN 2,000 now post without asking',['jorge']);toast('Rule '+k+' now acts on its own');render();return}
});

  if(t.dataset.act==='tgt'){S.targets[S.obj]=+t.value;S.locked=false;const g=gap();$('#tgtv').textContent=fmtO(S.targets[S.obj]);$('#tgtg').textContent=fmtG(g);$('#tgtw').textContent=O().value(g);return}

});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.act==='tbl'){S.tables[t.dataset.k]=t.checked;if(S.kg===2)S.kg=0;render();return}
  if(t.id==='persona'){S.seen[PMAP[S.persona]]=S.seq;S.persona=t.value;render();window.scrollTo({top:0});return}
  if(t.dataset.act==='owna'||t.dataset.act==='ownr'){const o=S.own[t.dataset.k]||{};o[t.dataset.act==='owna'?'a':'r']=t.value;S.own[t.dataset.k]=o;S.locked=false;render();return}
  if(t.dataset.act==='mode'){S.modes[t.dataset.k]=t.value;S.locked=false;return}

render();
